name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: physicalcraft-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Fetch pinned open-source libraries
        run: python3 fetch-deps.py
      - name: Scientific and blueprint checks
        run: ./test.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile emulator APK
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          PHYSICALCRAFT_ABI=x86_64 ./build-sdk.sh
      - name: Launch and exercise app on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar" ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" bash tests/android-smoke.sh
      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-startup-test
          path: |
            build/smoke/result.txt
            build/smoke/logcat.txt
            build/smoke/screen.png
      - name: Compile and sign development APK
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ./build-sdk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhysicalCraft-Android
          path: releases/PhysicalCraft-v0.1.1.apk
      - name: Publish downloadable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 releases/PhysicalCraft-v0.1.1.apk --clobber
          else
            gh release create v0.1.1 releases/PhysicalCraft-v0.1.1.apk --target "$GITHUB_SHA" --title 'PhysicalCraft 0.1.1 · Startup fix' --notes-file RELEASE_NOTES.md
          fi
