name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_ai:
        description: Download and run the local model in the emulator
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: physicalcraft-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select regression scope
        env:
          MANUAL_AI_TEST: ${{ inputs.test_ai }}
        run: |
          python3 - <<'PY'
          import os,subprocess
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          sensitive=('GemmaDirector.java','ModelDownload.java','Blueprint.java','fetch-deps.py','SHA256SUMS','StartupTest.java')
          full=os.environ.get('MANUAL_AI_TEST')=='true' or any(p.endswith(sensitive) for p in changed)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PHYSICALCRAFT_AI_TEST='+str(full).lower()+'\n')
          print('Full model download and inference test:',full)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Fetch pinned open-source libraries
        run: python3 fetch-deps.py
      - name: Scientific and blueprint checks
        run: ./test.sh
      - name: Cache public model test fixture
        if: env.PHYSICALCRAFT_AI_TEST == 'true'
        uses: actions/cache@v4
        with:
          path: .ci-model/qwen.litertlm
          key: qwen-litert-2df6821ec12702dafd33915e7a1a1adc7c4b053f3672fd9555dfaf3a114c4139
      - name: Prepare verified model fixture
        if: env.PHYSICALCRAFT_AI_TEST == 'true'
        run: python3 tests/fetch-model.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile emulator APK
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          PHYSICALCRAFT_ABI=x86_64 ./build-sdk.sh
      - name: Launch and exercise app on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8192M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar" ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" bash tests/android-smoke.sh
      - name: Save startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-startup-test
          path: |
            build/smoke/result.txt
            build/smoke/logcat.txt
            build/smoke/screen.png
      - name: Compile and sign development APK
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ./build-sdk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhysicalCraft-Android
          path: releases/PhysicalCraft-v0.2.0.apk
      - name: Publish downloadable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 releases/PhysicalCraft-v0.2.0.apk build/smoke/screen.png --clobber
          else
            gh release create v0.2.0 releases/PhysicalCraft-v0.2.0.apk build/smoke/screen.png --target "$GITHUB_SHA" --title 'PhysicalCraft 0.2.0 · Third-person expedition' --notes-file RELEASE_NOTES.md
          fi
