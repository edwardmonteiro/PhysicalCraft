name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: physicalcraft-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Fetch pinned open-source libraries
        run: python3 fetch-deps.py
      - name: Scientific and blueprint checks
        run: ./test.sh
      - name: Compile and sign development APK
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-36/android.jar
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ./build-sdk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhysicalCraft-Android
          path: releases/PhysicalCraft-v0.1.0.apk
      - name: Publish downloadable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 releases/PhysicalCraft-v0.1.0.apk --clobber
          else
            gh release create v0.1.0 releases/PhysicalCraft-v0.1.0.apk --target "$GITHUB_SHA" --title 'PhysicalCraft 0.1.0 · Expedition prototype' --notes-file RELEASE_NOTES.md
          fi
